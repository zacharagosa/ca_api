openapi: 3.0.3
info:
  title: Gaming Analytics Enterprise Agent API
  description: >
    Enterprise AI agent tools for querying Looker gaming analytics, Spanner graph clan hierarchies,
    automated LiveOps dashboard management, and executive daily summaries.
  version: 2.0.0
servers:
  - url: https://ca-api-1094200614711.us-central1.run.app
    description: Production Cloud Run Backend
  - url: http://localhost:8080
    description: Local Development Backend

paths:
  /api/query:
    post:
      summary: Autonomous Multi-Agent Gaming Query
      description: >
        Submits a natural language gaming question to the autonomous multi-agent dispatcher.
        Automatically routes across quantitative metrics (Looker), clan/friendship social graphs (Spanner),
        LiveOps dashboard builder, or deep research cross-domain synthesis.
      operationId: queryGamingAnalytics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - question
              properties:
                question:
                  type: string
                  description: The natural language question (e.g. "What was our DAU and revenue yesterday by game?", "Show me the clan hierarchy for Dragonslayers").
                  example: "What was total revenue and DAU yesterday by game?"
                agent_type:
                  type: string
                  description: Optional routing mode override ('auto', 'fast', 'deep', or 'mcp').
                  enum: [auto, fast, deep, mcp]
                  default: auto
                session_id:
                  type: string
                  description: Session identifier for conversational memory across turns.
                  default: "ge_session"
                model_name:
                  type: string
                  description: Reasoning model to use (default gemini-3.6-flash).
                  example: "gemini-3.6-flash"
      responses:
        '200':
          description: Successful query execution.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  question:
                    type: string
                  subagent:
                    type: string
                    example: "metrics_fast"
                  subagent_name:
                    type: string
                    example: "Metrics Analyst"
                  answer:
                    type: string
                    description: Formatted Markdown response with synthesized narrative, findings, and metrics.
                  table_data:
                    type: object
                    description: Structured tabular data returned by the query.
                    properties:
                      fields:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            label:
                              type: string
                      rows:
                        type: array
                        items:
                          type: object
                  chart:
                    type: object
                    description: Chart configuration (Chart.js or Vega-Lite specification) for data visualization.
                  explore_url:
                    type: string
                    description: Direct deep link to Looker Explore for verification and interactive slicing.
                  model:
                    type: string
        '400':
          description: Invalid request parameters.
        '500':
          description: Server execution error.

  /api/insights:
    post:
      summary: Query Looker Semantic Layer
      description: >
        Executes a targeted natural language query directly against the Looker Conversational Analytics API
        and returns semantic data insights, generated SQL, explore links, and metadata.
      operationId: getLookerInsights
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - question
              properties:
                question:
                  type: string
                  description: The specific quantitative question about mobile gaming metrics.
                  example: "What is the D1 retention rate and ARPU for iOS users in US over the last 30 days?"
      responses:
        '200':
          description: Successful retrieval of Looker insights.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  data_insights:
                    type: array
                    items:
                      type: object
                      properties:
                        result:
                          type: object
                        sql:
                          type: string
                        explore_url:
                          type: string
                  text_insights:
                    type: array
                    items:
                      type: string

  /api/daily-summary:
    get:
      summary: Get Executive Daily Summary
      description: >
        Retrieves yesterday's automated executive briefing, comparing Lookup Battle Royale and Lookerwood Farm
        across DAU, Total Revenue, IAP vs. Ad revenue mix, Sessions, and D1 Retention with action items.
      operationId: getDailySummary
      parameters:
        - name: force_refresh
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: If true, forces real-time regeneration bypassing cache.
      responses:
        '200':
          description: Daily summary insights payload.
          content:
            application/json:
              schema:
                type: object
                properties:
                  timestamp:
                    type: string
                  game_comparison:
                    type: string
                  games:
                    type: object
                    properties:
                      overall:
                        type: object
                      battle_royale:
                        type: object
                      farm:
                        type: object

  /api/player-safety-summary:
    get:
      summary: Get Player Safety & Moderation Telemetry
      description: >
        Returns trust & safety telemetry, toxicity exposure vs retention impact curves, real-time incident logs,
        and automated mitigation velocity.
      operationId: getPlayerSafetySummary
      parameters:
        - name: game
          in: query
          required: false
          schema:
            type: string
            enum: [overall, battle_royale, farm]
            default: overall
          description: Filter safety metrics by specific game or overall portfolio.
      responses:
        '200':
          description: Player safety metrics and incidents.
          content:
            application/json:
              schema:
                type: object
                properties:
                  kpis:
                    type: object
                  incidents:
                    type: array
                    items:
                      type: object
                  exposure_chart:
                    type: object
                  vector_chart:
                    type: object

  /api/cohort-analyzer:
    get:
      summary: Get Cohort Retention & Player Lifecycle Curves
      description: >
        Retrieves cohort retention analysis comparing D1, D7, D14, and D30 retention rates across user install cohorts.
      operationId: getCohortAnalysis
      responses:
        '200':
          description: Cohort retention analysis data.
          content:
            application/json:
              schema:
                type: object

  /api/embed:
    post:
      summary: Generate Looker Signed Embed URL
      description: >
        Generates a secure, signed Looker SSO cookieless embed session URL for interactive dashboard viewing.
      operationId: generateLookerEmbedUrl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - target_url
              properties:
                target_url:
                  type: string
                  description: Target dashboard path (e.g. "/dashboards/89" or "/embed/dashboards/47").
                user_id:
                  type: string
                  default: "ge_user"
                first_name:
                  type: string
                  default: "Gemini"
                last_name:
                  type: string
                  default: "User"
      responses:
        '200':
          description: Signed SSO embed URL.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                  expires_in:
                    type: integer
