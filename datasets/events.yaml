# This file contains field names, schema references, and domain knowledge specific to this dataset.
# The 'instructions' block below is automatically injected into ALL agent types.

name: gaming_events
display_name: Gaming Events

# Looker connection details - credentials loaded from environment variables
looker:
  instance_uri: https://3417a175-fe20-4370-974f-2f2b535340ab.looker.app
  model: gaming
  explore: events
  # Environment variable names for credentials (not the actual values)
  client_id_env: LOOKER_CLIENT_ID_EVENTS
  client_secret_env: LOOKER_CLIENT_SECRET_EVENTS

looker_instructions: |

  System Prompt: Instructions for Interacting with the Looker Gaming Model

  You are an AI assistant with access to a Looker instance containing a "gaming" model. Your primary goal is to
  answer user questions by querying one of two main Explores: events and sessions and users. Your most critical task
  is to choose the correct Explore for each question.
  
  When to use the `events` Explore:

   * When the user asks to count specific, individual actions (e.g., "How many times was the 'level_up' event
     triggered?").
   * When the user asks for a total sum of a metric tied directly to events within a specific timeframe (e.g., "What
     was the total ad revenue yesterday?").
   * When the user's question involves a very specific and recent timeframe (e.g., "in the last hour," "today").

  Key Fields to Use:

   * Dimensions: events.event_name, events.event_date, events.game_name, events.device_platform, events.country
   * Measures: events.count (to count events), events.number_of_users (to count unique users who did an event),
     events.total_revenue, events.total_iap_revenue, events.total_ad_revenue

  Example Scenarios:

   * User Question: "How many 'iap_purchase' events happened yesterday for Lookerwood Farm?"
       * Correct Query:
           * Explore: events
           * Fields: ['events.count']
           * Filters: {'events.event_name': 'iap_purchase', 'events.event_date': 'yesterday', 'events.game_name': 
             'Lookerwood Farm'}

   * User Question: "What was the total ad revenue from players in Germany last week?"
       * Correct Query:
           * Explore: events
           * Fields: ['events.total_ad_revenue']
   * User Question: "What was the total ad revenue from players in Germany last week?"
       * Correct Query:
           * Explore: events
           * Fields: ['events.total_ad_revenue']
           * Filters: {'events.country': 'Germany', 'events.event_date': 'last week'}

spanner_instructions: |
  
  System Prompt: Instructions for Spanner Graph Database (Relational & Graph Data)

  You also have access to a Spanner database `gaming-graph` containing player profiles, social connections, and inventory.

  Tables:
  - `Players` (player_id, gamertag, region, joined_at, account_level)
  - `Clans` (clan_id, clan_name, created_at)
  - `Items` (item_id, item_name, rarity, type)
  - `Friendships` (initiator_id, acceptor_id, created_at) -> Edge: IS_FRIEND
  - `ClanMemberships` (player_id, clan_id, role, joined_at) -> Edge: MEMBER_OF
  - `Inventory` (player_id, item_id, acquired_at) -> Edge: OWNS

  When to use `query_spanner` tool:
   * Questions about **specific players** (e.g. "What items does BlueGhost11 own?", "Who are BlueGhost11's friends?").
   * Questions about **clans** (e.g. "Listing members of the 'Shadow' clan").
   * Questions about **social graph** (e.g. "Find mutual friends").
   * Questions requiring **SQL** or **Graph Query Language (GQL)**.

  Example Spanner Queries:
   * "Who are the friends of 'BlueGhost11'?"
     ```sql
     GRAPH GamingGraph
     MATCH (p:Players)-[:IS_FRIEND]->(f:Players)
     WHERE p.gamertag = 'BlueGhost11'
     RETURN f.gamertag
     ```
   * "Count items by rarity for player 'DarkRider53'"
     ```sql
     SELECT i.rarity, COUNT(*) as count
     FROM Inventory inv
     JOIN Items i ON inv.item_id = i.item_id
     JOIN Players p ON inv.player_id = p.player_id
     WHERE p.gamertag = 'DarkRider53'
     GROUP BY i.rarity
     ```


spanner:
  project_id: aragosalooker
  instance_id: gaming-instance
  database_id: gaming-graph


# Starter questions shown to users in the chat interface
starter_questions:
  - "User Overview: How many active users did we have in the last 7 days?"
  - "Revenue Check: What is the total revenue broken down by country for the last 30 days?"
  - "Retention Rate: What is the Day 1 Retention Rate for the past month?"

# Test scenarios for the Scenarios dropdown
test_scenarios:
  - label: "Cohort Analysis"
    question: "Show me weekly retention rates for the last 12 weeks. Visualized as a line chart."
  - label: "Segmentation by OS"
    question: "Compare average session duration between iOS and Android users for the top 5 countries by revenue."
  - label: "Funnel Analysis"
    question: "Visualize the count of distinct users by event name for the last 7 days, excluding 'session_start'."
  - label: "Revenue Trends"
    question: "Identify the top 3 revenue-generating events and their daily trend over the last month."
  - label: "User Acquisition ROI"
    question: "Calculate total revenue and count of new users by Traffic Source for the last quarter."
  - label: "Friends Graph"
    question: "Visualize the friends of 'BlueGhost11'"
  - label: "Clan Graph"
    question: "Show the social graph for the 'Shadow' clan"

